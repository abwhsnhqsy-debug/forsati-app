name: Forsati Release AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout original app
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          package-manager-cache: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare original web app
        run: |
          test -f index.html
          rm -rf www
          mkdir -p www
          cp index.html www/index.html

      - name: Prepare Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Verify Application ID
        run: |
          grep -R "com.forsati.app" android/app/build.gradle android/gradle.properties android/variables.gradle 2>/dev/null || true

      - name: Create release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FORSATI_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: FORSATI_KEYSTORE_BASE64 is missing."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/forsati-release-key.jks
          test -s android/forsati-release-key.jks

      - name: Validate release keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.FORSATI_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FORSATI_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: Keystore secrets are missing."
            exit 1
          fi
          echo "Checking keystore..."
          keytool -list -keystore android/forsati-release-key.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "Keystore validation: PASSED"

      - name: Create keystore properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.FORSATI_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FORSATI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FORSATI_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: One or more signing secrets are missing."
            exit 1
          fi
          cat > android/keystore.properties <<EOF2
          storeFile=../forsati-release-key.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF2

      - name: Configure release signing
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app/build.gradle")
          text = path.read_text()
          if "signingConfigs" not in text:
              block = '''signingConfigs {
              release {
                  def keystorePropertiesFile = rootProject.file("keystore.properties")
                  def keystoreProperties = new Properties()
                  if (keystorePropertiesFile.exists()) {
                      keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                  }
                  storeFile file(keystoreProperties["storeFile"])
                  storePassword keystoreProperties["storePassword"]
                  keyAlias keystoreProperties["keyAlias"]
                  keyPassword keystoreProperties["keyPassword"]
              }
          }
          '''
              text = text.replace("android {", "android {\n" + block, 1)
          if "signingConfig signingConfigs.release" not in text:
              text = text.replace("buildTypes {", "buildTypes {\n        release {\n            signingConfig signingConfigs.release\n        }", 1)
          path.write_text(text)
          PY

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Google Play AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Verify AAB
        run: |
          AAB=$(find android/app/build/outputs/bundle -type f -name "*.aab" | head -n 1)
          if [ -z "$AAB" ]; then
            echo "ERROR: AAB was not generated."
            exit 1
          fi
          ls -lh "$AAB"
          cp "$AAB" forsati-release.aab

      - name: Upload Google Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: forsati-release-aab
          path: forsati-release.aab
          if-no-files-found: error
          
