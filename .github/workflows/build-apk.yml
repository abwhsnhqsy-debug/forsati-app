name: Forsati Release AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout original app
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          package-manager-cache: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare original web app
        run: |
          test -f index.html
          rm -rf www
          mkdir -p www
          cp index.html www/index.html

      - name: Prepare Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Verify Application ID
        run: |
          grep -R "com.forsati.app" \
            android/app/build.gradle \
            android/gradle.properties \
            android/variables.gradle \
            2>/dev/null || true

      # ----------------------------------------
      # CREATE RELEASE KEYSTORE
      # ----------------------------------------

      - name: Create release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FORSATI_KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: FORSATI_KEYSTORE_BASE64 is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > android/forsati-release-key.jks

          if [ ! -s android/forsati-release-key.jks ]; then
            echo "ERROR: Keystore file was not created."
            exit 1
          fi

          echo "Keystore file created successfully."

      # ----------------------------------------
      # VALIDATE ALL SIGNING SECRETS
      # ----------------------------------------

      - name: Validate release keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.FORSATI_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FORSATI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FORSATI_KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: FORSATI_KEYSTORE_PASSWORD is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: FORSATI_KEY_ALIAS is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: FORSATI_KEY_PASSWORD is missing."
            exit 1
          fi

          echo "Checking keystore..."

          keytool -list \
            -keystore android/forsati-release-key.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            >/dev/null

          echo "Keystore password: OK"

          keytool -list \
            -keystore android/forsati-release-key.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null

          echo "Alias: OK"

          cat > /tmp/ValidateKey.java <<'JAVA'
          import java.io.FileInputStream;
          import java.security.Key;
          import java.security.KeyStore;

          public class ValidateKey {
              public static void main(String[] args) throws Exception {
                  String file = args[0];
                  String storePassword = args[1];
                  String alias = args[2];
                  String keyPassword = args[3];

                  KeyStore ks = KeyStore.getInstance("PKCS12");

                  try (FileInputStream in = new FileInputStream(file)) {
                      ks.load(in, storePassword.toCharArray());
                  }

                  Key key = ks.getKey(alias, keyPassword.toCharArray());

                  if (key == null) {
                      throw new Exception("Private key could not be loaded.");
                  }

                  System.out.println("Private key password: OK");
                  System.out.println("Keystore validation: PASSED");
              }
          }
          JAVA

          javac /tmp/ValidateKey.java

          java -cp /tmp ValidateKey \
            android/forsati-release-key.jks \
            "$KEYSTORE_PASSWORD" \
            "$KEY_ALIAS" \
            "$KEY_PASSWORD"

      # ----------------------------------------
      # CREATE GRADLE SIGNING PROPERTIES
      # ----------------------------------------

      - name: Create keystore properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.FORSATI_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FORSATI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FORSATI_KEY_PASSWORD }}
        run: |
          set -e

          cat > android/keystore.properties <<EOF
          storeFile=../forsati-release-key.jks
          storeType=PKCS12
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

          echo "Keystore properties created."

      # ----------------------------------------
      # CONFIGURE GRADLE SIGNING
      # ----------------------------------------

      - name: Configure release signing
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle")
          text = path.read_text()

          if "signingConfigs" not in text:
              signing_block = r'''
          signingConfigs {
              release {
                  def keystorePropertiesFile = rootProject.file("keystore.properties")
                  def keystoreProperties = new Properties()

                  if (keystorePropertiesFile.exists()) {
                      keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                  }

                  storeFile file(keystoreProperties["storeFile"])
                  storePassword keystoreProperties["storePassword"]
                  keyAlias keystoreProperties["keyAlias"]
                  keyPassword keystoreProperties["keyPassword"]
              }
          }

          '''

              text = text.replace(
                  "android {",
                  "android {\n" + signing_block,
                  1
              )

          if "signingConfig signingConfigs.release" not in text:
              text = text.replace(
                  "buildTypes {",
                  """buildTypes {
              release {
                  signingConfig signingConfigs.release
              }
              """,
                  1
              )

          path.write_text(text)
          PY

      # ----------------------------------------
      # BUILD GOOGLE PLAY AAB
      # ----------------------------------------

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Google Play AAB
        working-directory: android
        run: |
          ./gradlew bundleRelease --no-daemon

      # ----------------------------------------
      # VERIFY AAB
      # ----------------------------------------

      - name: Verify AAB
        run: |
          set -e

          echo "Searching for generated AAB..."

          AAB=$(find android/app/build/outputs/bundle \
            -type f \
            -name "*.aab" \
            | head -n 1)

          if [ -z "$AAB" ]; then
            echo "ERROR: AAB was not generated."
            exit 1
          fi

          echo "AAB generated successfully:"
          ls -lh "$AAB"

          cp "$AAB" forsati-release.aab

      # ----------------------------------------
      # UPLOAD AAB
      # ----------------------------------------

      - name: Upload Google Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: forsati-release-aab
          path: forsati-release.aab
          if-no-files-found: error
